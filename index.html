<style>
:root{
  --bg:#14181C;
  --panel:#1B2026;
  --panel-2:#232A31;
  --border:#2E363D;
  --border-soft:#262D33;
  --text:#EDEFF1;
  --text-dim:#8F9BA3;
  --text-faint:#5E6970;
  --amber:#F2A93B;
  --amber-dim:#4A3A1E;
  --green:#4E9F6E;
  --green-dim:#1D3327;
  --blue:#5B8DBE;
  --blue-dim:#1D2C3A;
  --red:#C75450;
  --red-dim:#3A2223;
  --radius:14px;
  --radius-sm:9px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
button{font-family:inherit;}
#app{
  display:flex;
  flex-direction:column;
  height:100vh;
  height:100dvh;
  max-width:640px;
  margin:0 auto;
  position:relative;
  border-left:1px solid var(--border-soft);
  border-right:1px solid var(--border-soft);
}
/* ---------- Topbar ---------- */
.topbar{
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  background:var(--bg);
  border-bottom:1px solid var(--border-soft);
  flex-shrink:0;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.topbar h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.01em;}
.topbar .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.icon-btn:active{background:var(--panel-2);}
.icon-btn svg{width:18px;height:18px;}
.search-row{margin-top:12px;display:flex;gap:8px;}
.search-box{
  flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);
  border:1px solid var(--border);border-radius:11px;padding:0 12px;height:38px;
}
.search-box svg{width:15px;height:15px;color:var(--text-faint);flex-shrink:0;}
.search-box input{
  background:none;border:none;outline:none;color:var(--text);font-size:14px;width:100%;height:100%;
}
.search-box input::placeholder{color:var(--text-faint);}

/* ---------- Chips ---------- */
.chip-row{
  display:flex;gap:7px;overflow-x:auto;padding:2px 18px 10px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel);color:var(--text-dim);font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.chip .count{font-weight:500;opacity:0.65;font-size:11.5px;}
.chip.active{background:var(--amber);border-color:var(--amber);color:#1B1204;}
.chip.active .count{opacity:0.55;}
.chip.state-Pendiente.active{background:var(--amber);border-color:var(--amber);color:#1B1204;}
.chip.state-Lista.active{background:var(--green);border-color:var(--green);color:#0C1F14;}
.chip.state-MND.active{background:var(--red);border-color:var(--red);color:#210D0C;}
.chip.state-Asociar.active{background:var(--blue);border-color:var(--blue);color:#0D1A26;}
.chip.state-Vencido{color:var(--red);}
.chip.state-Vencido.active{background:var(--red);border-color:var(--red);color:#210D0C;}

/* ---------- Month strip ---------- */
.month-strip{
  display:flex;gap:8px;overflow-x:auto;padding:12px 18px;scrollbar-width:none;
  border-bottom:1px solid var(--border-soft);
}
.month-strip::-webkit-scrollbar{display:none;}
.month-pill{
  flex-shrink:0;min-width:64px;padding:9px 8px 8px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);text-align:center;cursor:pointer;
}
.month-pill .m-name{display:block;font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.month-pill .m-count{display:block;font-family:'Space Grotesk';font-size:19px;font-weight:700;margin-top:3px;color:var(--text);}
.month-pill.active{background:var(--panel-2);border-color:var(--amber);}
.month-pill.active .m-name{color:var(--amber);}
.month-pill.current::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--amber);margin:4px auto 0;}

/* ---------- Main / views ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px;}
.view{display:none;}
.view.active{display:block;}
.section-label{
  padding:14px 18px 6px;font-size:11.5px;font-weight:600;color:var(--text-faint);
  text-transform:uppercase;letter-spacing:0.04em;
}
.empty-state{
  padding:50px 30px;text-align:center;color:var(--text-faint);
}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:0.5;}
.empty-state p{margin:0;font-size:13.5px;line-height:1.5;}

/* ---------- Task card ---------- */
.task-list{padding:6px 18px 4px;display:flex;flex-direction:column;gap:9px;}
.task-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 14px;cursor:pointer;position:relative;
}
.task-card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.task-card .cliente{font-size:14.5px;font-weight:600;line-height:1.3;}
.task-card .localidad-line{
  display:flex;align-items:center;gap:5px;color:var(--text-dim);font-size:12.5px;margin-top:3px;
}
.task-card .localidad-line svg{width:11px;height:11px;flex-shrink:0;}
.badge{
  flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;
  text-transform:uppercase;letter-spacing:0.02em;white-space:nowrap;
}
.badge.state-Pendiente{background:var(--amber-dim);color:var(--amber);}
.badge.state-Lista{background:var(--green-dim);color:var(--green);}
.badge.state-MND{background:var(--red-dim);color:var(--red);}
.badge.state-Asociar{background:var(--blue-dim);color:var(--blue);}
.task-card .meta-row{
  display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px;
}
.meta-tag{
  font-size:11.5px;color:var(--text-dim);background:var(--panel-2);border-radius:7px;
  padding:4px 8px;display:flex;align-items:center;gap:4px;
}
.meta-tag b{color:var(--text);font-weight:600;}
.meta-tag.dist{color:var(--amber);background:var(--amber-dim);}
.quick-actions{display:flex;gap:6px;margin-top:11px;}
.qa-btn{
  flex:1;padding:7px 4px;border-radius:9px;border:1px solid var(--border);background:transparent;
  color:var(--text-dim);font-size:11.5px;font-weight:600;cursor:pointer;
}
.qa-btn.active-Pendiente{background:var(--amber-dim);color:var(--amber);border-color:transparent;}
.qa-btn.active-Lista{background:var(--green-dim);color:var(--green);border-color:transparent;}
.qa-btn.active-MND{background:var(--red-dim);color:var(--red);border-color:transparent;}
.qa-btn.active-Asociar{background:var(--blue-dim);color:var(--blue);border-color:transparent;}

/* ---------- Tabbar ---------- */
.tabbar{
  display:flex;border-top:1px solid var(--border-soft);background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;
}
.tab-btn{
  flex:1;background:none;border:none;padding:10px 4px calc(8px + env(safe-area-inset-bottom) - env(safe-area-inset-bottom));
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-faint);cursor:pointer;
}
.tab-btn svg{width:21px;height:21px;}
.tab-btn span{font-size:10.5px;font-weight:600;}
.tab-btn.active{color:var(--amber);}

/* ---------- Sheet / modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:40;opacity:0;pointer-events:none;
  transition:opacity 0.18s ease;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--panel);
  border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;
  z-index:41;transform:translateY(100%);transition:transform 0.22s cubic-bezier(.2,.8,.3,1);
  max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:10px auto 4px;flex-shrink:0;}
.sheet-head{
  display:flex;justify-content:space-between;align-items:center;padding:8px 18px 10px;
  border-bottom:1px solid var(--border-soft);flex-shrink:0;
}
.sheet-head h3{margin:0;font-size:16px;font-weight:700;}
.sheet-body{overflow-y:auto;padding:14px 18px 24px;}
.link-btn{background:none;border:none;color:var(--amber);font-size:13px;font-weight:600;cursor:pointer;padding:4px;}

.field-label{font-size:11.5px;font-weight:600;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;margin:16px 0 8px;}
.field-label:first-child{margin-top:0;}
.option-grid{display:flex;flex-wrap:wrap;gap:7px;}
.option-btn{
  padding:8px 13px;border-radius:10px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;
}
.option-btn.active{background:var(--amber);border-color:var(--amber);color:#1B1204;}
select, input[type=text], input[type=number], input[type=date], textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238F9BA3' stroke-width='2'><path d='M2 5l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;
}
label.chk{display:flex;align-items:center;gap:9px;padding:10px 0;font-size:13.5px;color:var(--text);}
label.chk input{width:17px;height:17px;accent-color:var(--amber);}

.modal-sheet .sheet-body{padding-top:6px;}
.detail-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
.detail-row:last-child{border-bottom:none;}
.detail-row .k{color:var(--text-faint);}
.detail-row .v{color:var(--text);font-weight:600;text-align:right;}
.hist-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.hist-dot{font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:8px;}
.hist-dot.amarillo{background:var(--amber-dim);color:var(--amber);}
.hist-dot.verde{background:var(--green-dim);color:var(--green);}

.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;}
.state-big-btn{
  padding:13px 10px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);font-size:13px;font-weight:700;cursor:pointer;
}
.state-big-btn.sel-Pendiente{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
.state-big-btn.sel-Lista{background:var(--green-dim);border-color:var(--green);color:var(--green);}
.state-big-btn.sel-MND{background:var(--red-dim);border-color:var(--red);color:var(--red);}
.state-big-btn.sel-Asociar{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}

.primary-btn{
  width:100%;background:var(--amber);color:#1B1204;border:none;border-radius:12px;
  padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:16px;
}
.danger-link{display:block;text-align:center;color:var(--red);font-size:13px;font-weight:600;
  background:none;border:none;margin-top:14px;padding:6px;width:100%;cursor:pointer;}

.fab{
  position:absolute;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:52px;height:52px;
  border-radius:16px;background:var(--amber);color:#1B1204;border:none;display:flex;
  align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,0.4);cursor:pointer;z-index:20;
}
.fab svg{width:24px;height:24px;}

/* ---------- Plan view ---------- */
.plan-date-bar{
  display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border-soft);
}
.plan-date-bar input[type=date]{flex:1;}
.plan-summary{display:flex;gap:8px;padding:12px 18px 0;}
.plan-stat{
  flex:1;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:9px 10px;text-align:center;
}
.plan-stat .n{font-family:'Space Grotesk';font-size:18px;font-weight:700;}
.plan-stat .l{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}
.plan-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 13px;display:flex;gap:11px;align-items:center;
}
.plan-order-controls{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.order-btn{
  width:26px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);
  color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.order-btn svg{width:13px;height:13px;}
.plan-card .num{
  font-family:'Space Grotesk';font-weight:700;font-size:14px;color:var(--text-faint);flex-shrink:0;width:18px;text-align:center;
}
.plan-card-body{flex:1;min-width:0;}
.plan-card-body .cliente{font-size:13.5px;font-weight:600;}
.plan-card-body .sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.plan-remove{
  width:28px;height:28px;border-radius:8px;border:none;background:transparent;color:var(--text-faint);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.plan-remove svg{width:16px;height:16px;}

.picker-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--border-soft);
}
.picker-item .cliente{font-size:13.5px;font-weight:600;}
.picker-item .sub{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.add-btn{
  flex-shrink:0;padding:7px 14px;border-radius:9px;border:1px solid var(--amber);background:transparent;
  color:var(--amber);font-size:12px;font-weight:700;cursor:pointer;
}
.add-btn.added{background:var(--amber);color:#1B1204;}

::-webkit-scrollbar{width:0;height:0;}

/* ---------- Overdue banner ---------- */
#overdueBanner{
  background:var(--red-dim);border-bottom:1px solid var(--red);padding:10px 18px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#overdueBanner svg{width:17px;height:17px;color:var(--red);flex-shrink:0;}
#overdueBanner p{margin:0;font-size:12.5px;color:var(--text);flex:1;line-height:1.4;}
#overdueBanner button{
  background:none;border:1px solid var(--red);color:var(--red);border-radius:8px;
  padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0;
}
.badge.state-Vencido{background:var(--red-dim);color:var(--red);}
.mix-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;}
.mix-chip{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:20px;white-space:nowrap;}
.mix-chip.state-Pendiente{background:var(--amber-dim);color:var(--amber);}
.mix-chip.state-Lista{background:var(--green-dim);color:var(--green);}
.mix-chip.state-MND{background:var(--red-dim);color:var(--red);}
.mix-chip.state-Asociar{background:var(--blue-dim);color:var(--blue);}
.abono-badge{
  font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;color:#14181C;
}
.fresh-dot{display:inline-flex;align-items:center;gap:5px;}
.fresh-dot .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
.fresh-fresco{background:#4E9F6E;}
.fresh-medio{background:#F2A93B;}
.fresh-alerta{background:#E07B39;}
.fresh-vencido{background:#C75450;}
.note-preview{
  margin-top:9px;padding:8px 10px;background:var(--amber-dim);border-radius:9px;
  font-size:11.5px;color:var(--amber);display:flex;gap:6px;align-items:flex-start;line-height:1.4;
}
.note-preview svg{width:13px;height:13px;flex-shrink:0;margin-top:1px;}
.drag-handle{
  width:22px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  color:var(--text-faint);cursor:grab;touch-action:none;
}
.drag-handle svg{width:15px;height:15px;}
.plan-card.dragging{opacity:0.5;}
.plan-mini-actions{display:flex;gap:5px;margin-top:9px;}
.plan-mini-btn{
  flex:1;padding:6px 2px;border-radius:8px;border:1px solid var(--border);background:transparent;
  color:var(--text-dim);font-size:10.5px;font-weight:600;cursor:pointer;
}
.plan-mini-btn.active-Pendiente{background:var(--amber-dim);color:var(--amber);border-color:transparent;}
.plan-mini-btn.active-Lista{background:var(--green-dim);color:var(--green);border-color:transparent;}
.plan-mini-btn.active-MND{background:var(--red-dim);color:var(--red);border-color:transparent;}
.plan-mini-btn.active-Asociar{background:var(--blue-dim);color:var(--blue);border-color:transparent;}
.dist-editor-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}
.dist-editor-row .lbl{font-size:13px;font-weight:600;}
.dist-editor-row input{width:64px;text-align:center;padding:8px 4px;}
.dist-sum-hint{font-size:11.5px;margin-top:6px;color:var(--text-faint);}
.dist-sum-hint.err{color:var(--red);}
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div>
        <h1 id="pageTitle">Mantenimientos</h1>
        <div class="sub" id="pageSub">Cargando…</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="btnSettings" title="Distancias">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="btnFilter" title="Ordenar y filtrar" style="position:relative;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
          <span id="filterDot" style="display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:1.5px solid var(--bg);"></span>
        </button>
      </div>
    </div>
    <div class="search-row" id="searchRow">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar cliente, localidad o dirección…">
      </div>
    </div>
    <div class="chip-row" id="stateChipRow"></div>
  </header>

  <div id="overdueBanner" style="display:none;"></div>

  <main>
    <section class="view active" id="view-meses">
      <div class="month-strip" id="monthStrip"></div>
      <div class="section-label" id="mesesLabel">Este mes</div>
      <div class="task-list" id="mesesList"></div>
    </section>

    <section class="view" id="view-plan">
      <div class="plan-date-bar">
        <button class="icon-btn" id="planPrevDay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <input type="date" id="planDate">
        <button class="icon-btn" id="planNextDay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="plan-summary" id="planSummary"></div>
      <div class="section-label">Recorrido del día</div>
      <div class="task-list" id="planList"></div>
    </section>

    <section class="view" id="view-todos">
      <div class="section-label" id="todosLabel">Todas las tareas</div>
      <div class="task-list" id="todosList"></div>
    </section>
  </main>

  <button class="fab" id="fabAdd" title="Agregar tarea">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="meses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Meses</span>
    </button>
    <button class="tab-btn" data-view="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-5.447-2.724A1 1 0 0 1 3 16.382V5.618a1 1 0 0 1 1.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0 0 21 18.382V7.618a1 1 0 0 0-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
      <span>Planificar</span>
    </button>
    <button class="tab-btn" data-view="todos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      <span>Todos</span>
    </button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>

<!-- Filter sheet -->
<div class="sheet" id="filterSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Ordenar y filtrar</h3><button class="link-btn" id="filterReset">Restablecer</button></div>
  <div class="sheet-body">
    <div class="field-label">Ordenar por</div>
    <div class="option-grid" id="sortOptions"></div>
    <div class="field-label">Tipo de abono</div>
    <div class="option-grid" id="tipoOptions"></div>
    <div class="field-label">Localidad <span id="locFilterCount" style="color:var(--amber);"></span></div>
    <div id="localidadCheckList" style="max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:2px 12px;"></div>
    <button class="primary-btn" id="filterApply">Aplicar</button>
  </div>
</div>

<!-- Task detail modal -->
<div class="sheet modal-sheet" id="taskModal">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3 id="modalTitle">Tarea</h3><button class="link-btn" id="modalClose">Cerrar</button></div>
  <div class="sheet-body" id="modalBody"></div>
</div>

<!-- Add task sheet -->
<div class="sheet" id="addSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Nueva tarea</h3><button class="link-btn" id="addClose">Cerrar</button></div>
  <div class="sheet-body" id="addBody"></div>
</div>

<!-- Distances settings sheet -->
<div class="sheet" id="distSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Distancias por localidad</h3><button class="link-btn" id="distClose">Cerrar</button></div>
  <div class="sheet-body" id="distBody"></div>
</div>

<!-- Add-to-plan picker sheet -->
<div class="sheet" id="planPickerSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>Agregar al recorrido</h3><button class="link-btn" id="planPickerClose">Listo</button></div>

<script id="DATA_DIST" type="application/json">{"La Cocha": 141, "Juan B Alberdi": 119, "Aguilares": 104, "Concepcion": 99, "Monteros": 68, "Famailla": 53, "Yerba Buena": 10, "Simoca": 77, "Bella Vista": 49, "Tafi Del Valle": 121, "La Ramada": 47, "Los Ralos": 38, "Colombres": 33, "Alderetes": 22, "Trancas": 68, "Banda del Rio S": 19, "SM de Tuc": "LOCAL", "Rosario de la F": 126, "Lules": 20, "Termas": 88, "Los Nogales": 13, "Santiago Capital": 175}</script>
<script>
// ================= Datos base =================
const DEFAULT_TASKS = JSON.parse(document.getElementById('DATA_TASKS').textContent);
const DEFAULT_DIST = JSON.parse(document.getElementById('DATA_DIST').textContent);

const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ESTADOS = ['Pendiente','Lista','MND','Asociar'];
const TIPOS = ['Mensual','Bimestral','Trimestral','Semestral'];
const INTERVALO = {Mensual:1, Bimestral:2, Trimestral:3, Semestral:6};
const ABONO_COLOR = {Mensual:'#FFC000', Bimestral:'#C2D69B', Trimestral:'#92D050', Semestral:'#9DC3E6'};

const LS_TASKS = 'mant_tasks_v2';
const LS_DIST = 'mant_distancias_v1';

function loadTasks(){
  const raw = localStorage.getItem(LS_TASKS);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  const seeded = DEFAULT_TASKS.map(t => Object.assign({}, t));
  saveTasks(seeded);
  return seeded;
}
function saveTasks(t){ localStorage.setItem(LS_TASKS, JSON.stringify(t)); }

function loadDist(){
  const raw = localStorage.getItem(LS_DIST);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  saveDist(DEFAULT_DIST);
  return Object.assign({}, DEFAULT_DIST);
}
function saveDist(d){ localStorage.setItem(LS_DIST, JSON.stringify(d)); }

let TASKS = loadTasks();
let DIST = loadDist();

function syncDistancias(){
  TASKS.forEach(t => { if(DIST.hasOwnProperty(t.localidad)) t.distancia_km = DIST[t.localidad]; });
}
syncDistancias();

// ================= Utilidades de estado/distribución =================
function distTotal(t, estado){ return (t.distribucion && t.distribucion[estado]) || 0; }
function isFullyPending(t){ return distTotal(t,'Pendiente') === t.cantidad; }
function isMixed(t){
  const nonZero = ESTADOS.filter(e => distTotal(t,e) > 0);
  return nonZero.length > 1;
}
function dominantEstado(t){
  // el único estado con cantidad>0, o 'Pendiente' si está mezclado (no debería llamarse en ese caso)
  const nonZero = ESTADOS.filter(e => distTotal(t,e) > 0);
  return nonZero.length === 1 ? nonZero[0] : 'Pendiente';
}
function setAllTo(t, estado){
  t.distribucion = {Pendiente:0, Lista:0, MND:0, Asociar:0};
  t.distribucion[estado] = t.cantidad;
}

// ================= Vencimiento / renovación automática =================
function dueYM(t){ return t.anio_vencimiento*12 + (t.mes_vencimiento-1); }
function nowYM(){ const d = new Date(); return d.getFullYear()*12 + d.getMonth(); }

function isOverdue(t){ return dueYM(t) < nowYM(); }

function processRenewals(){
  let renewedCount = 0;
  TASKS.forEach(t=>{
    const interval = INTERVALO[t.tipo_abono] || 3;
    let guard = 0;
    while(dueYM(t) < nowYM() && guard < 60){
      guard++;
      if(isFullyPending(t)){
        // quedó sin marcar de ninguna manera: no se renueva solo, se avisa (vencido)
        break;
      }
      // se marcó (total o parcialmente): renovar ciclo, todo vuelve a Pendiente
      const total = t.mes_vencimiento - 1 + interval;
      t.anio_vencimiento = t.anio_vencimiento + Math.floor(total/12);
      t.mes_vencimiento = (total % 12) + 1;
      setAllTo(t, 'Pendiente');
      t.fecha_planificada = null;
      renewedCount++;
    }
  });
  if(renewedCount>0) saveTasks(TASKS);
}
processRenewals();

function overdueUnresolved(){
  return TASKS.filter(t => isOverdue(t) && isFullyPending(t));
}

// ================= Frescura (solo Trimestral) =================
function daysSince(iso){
  if(!iso) return null;
  const d = new Date(iso+'T00:00:00');
  const now = new Date();
  const diffMs = now.setHours(0,0,0,0) - d.setHours(0,0,0,0);
  return Math.round(diffMs / 86400000);
}
function freshnessInfo(t){
  if(t.tipo_abono !== 'Trimestral' || !t.ultimo_mantenimiento) return null;
  const d = daysSince(t.ultimo_mantenimiento);
  if(d === null || d < 0) return null;
  if(d <= 30) return {cls:'fresh-fresco', label:'Hecho hace ≤1 mes'};
  if(d <= 60) return {cls:'fresh-medio', label:'Hecho hace 1-2 meses'};
  if(d <= 90) return {cls:'fresh-alerta', label:'Hecho hace 2-3 meses'};
  return {cls:'fresh-vencido', label:'Hace más de 3 meses'};
}

// ================= Estado de UI =================
const state = {
  view: 'meses',
  search: '',
  estadoFilter: 'Todos',
  tipoFilter: 'Todos',
  localidadFilter: [], // vacío = todas
  sortBy: 'distancia',
  selectedMonth: (new Date().getMonth()+1),
  planDate: todayStr(),
  editingId: null,
};

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

// ================= Helpers =================
function distOf(t){ return (typeof t.distancia_km === 'number') ? t.distancia_km : 999; }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtKm(t){
  const d = t.distancia_km;
  if(d === null || d === undefined) return 'sin dato';
  if(d === 0) return 'Local';
  return d + ' km';
}
function uniqueLocalidades(){
  return [...new Set(TASKS.map(t=>t.localidad))].sort((a,b)=>a.localeCompare(b));
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function taskEstadoLabel(t){
  if(isOverdue(t) && isFullyPending(t)) return 'Vencido';
  if(isMixed(t)) return null; // se muestra desglosado
  return dominantEstado(t);
}

function isFiltersActive(){
  return state.tipoFilter!=='Todos' || state.localidadFilter.length>0 || state.sortBy!=='distancia' || state.estadoFilter!=='Todos';
}

function matchesEstadoFilter(t){
  if(state.estadoFilter==='Todos') return true;
  if(state.estadoFilter==='Vencido') return isOverdue(t) && isFullyPending(t);
  return distTotal(t, state.estadoFilter) > 0;
}

function applyFilters(list){
  let out = list.slice();
  out = out.filter(matchesEstadoFilter);
  if(state.tipoFilter !== 'Todos') out = out.filter(t=>t.tipo_abono===state.tipoFilter);
  if(state.localidadFilter.length>0) out = out.filter(t=>state.localidadFilter.includes(t.localidad));
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    out = out.filter(t =>
      (t.cliente||'').toLowerCase().includes(q) ||
      (t.localidad||'').toLowerCase().includes(q) ||
      (t.direccion||'').toLowerCase().includes(q)
    );
  }
  out.sort((a,b)=>{
    switch(state.sortBy){
      case 'distancia': return distOf(a)-distOf(b);
      case 'vencimiento': return dueYM(a)-dueYM(b);
      case 'tipo_abono': return a.tipo_abono.localeCompare(b.tipo_abono);
      case 'estado': return ESTADOS.indexOf(dominantEstado(a))-ESTADOS.indexOf(dominantEstado(b));
      case 'localidad': return a.localidad.localeCompare(b.localidad);
      case 'cliente': return (a.cliente||'').localeCompare(b.cliente||'');
      default: return 0;
    }
  });
  return out;
}

// ================= Chips de estado =================
function renderStateChips(){
  const row = document.getElementById('stateChipRow');
  const counts = {Todos: TASKS.length, Vencido: overdueUnresolved().length};
  ESTADOS.forEach(e => counts[e] = TASKS.filter(t=>distTotal(t,e)>0).length);
  const items = ['Todos', ...ESTADOS, 'Vencido'];
  row.innerHTML = items.map(e => `
    <div class="chip state-${e} ${state.estadoFilter===e?'active':''}" data-estado="${e}">
      ${e} <span class="count">${counts[e]}</span>
    </div>
  `).join('');
  row.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ state.estadoFilter = el.dataset.estado; renderAll(); });
  });
}

// ================= Tarjeta de tarea =================
function estadoBadgeHtml(t){
  if(isMixed(t)){
    return `<div class="mix-badges">${ESTADOS.filter(e=>distTotal(t,e)>0).map(e=>
      `<span class="mix-chip state-${e}">${e} ×${distTotal(t,e)}</span>`).join('')}</div>`;
  }
  const label = taskEstadoLabel(t);
  return `<div class="badge state-${label}">${label}</div>`;
}

function taskCardHtml(t){
  const venceLabel = MONTHS[(t.mes_vencimiento||1)-1];
  const abonoColor = ABONO_COLOR[t.tipo_abono] || '#8F9BA3';
  const fresh = freshnessInfo(t);
  const showQuick = !isMixed(t);
  return `
  <div class="task-card" data-id="${t.id}">
    <div class="row1">
      <div style="flex:1 1 180px;min-width:0;">
        <div class="cliente">${escapeHtml(t.cliente||'(sin cliente)')}</div>
        <div class="localidad-line">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          ${escapeHtml(t.localidad||'')} · ${fmtKm(t)}
        </div>
        <div class="localidad-line" style="margin-top:1px;">${escapeHtml(t.direccion||'')}</div>
      </div>
      ${estadoBadgeHtml(t)}
    </div>
    <div class="meta-row">
      <div class="abono-badge" style="background:${abonoColor};">${t.tipo_abono}</div>
      <div class="meta-tag">Vence: <b>&nbsp;${venceLabel}${t.anio_vencimiento!==2026?' '+t.anio_vencimiento:''}</b></div>
      <div class="meta-tag">Últ.: <b>&nbsp;${fmtDate(t.ultimo_mantenimiento)}</b></div>
      <div class="meta-tag">${t.cantidad} equipo${t.cantidad>1?'s':''}</div>
      ${t.modelo ? `<div class="meta-tag">${escapeHtml(t.modelo)}</div>` : ''}
      ${fresh ? `<div class="meta-tag fresh-dot" title="${fresh.label}"><span class="dot ${fresh.cls}"></span>${fresh.label}</div>` : ''}
    </div>
    ${t.nota ? `<div class="note-preview">

function currentPlanTasks(){

function renderPlan(){

  `;
  const container = document.getElementById('planList');
  if(dayTasks.length===0){
    container.innerHTML = emptyStateHtml('Todavía no agregaste paradas para este día. Usá el botón + para sumar tareas.');
    return;
  }
  container.innerHTML = dayTasks.map((t,idx)=>`
    <div class="plan-card" data-id="${t.id}">
      <div class="drag-handle" data-id="${t.id}" title="Arrastrar para reordenar">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
      </div>
      <div class="num">${idx+1}</div>
      <div class="plan-card-body">
        <div class="cliente">${escapeHtml(t.cliente||'')}</div>
        <div class="sub">${escapeHtml(t.localidad)} · ${fmtKm(t)}</div>
        ${!isMixed(t) ? `<div class="plan-mini-actions">
          ${ESTADOS.map(e=>`<button class="plan-mini-btn ${dominantEstado(t)===e?'active-'+e:''}" data-id="${t.id}" data-estado="${e}">${e}</button>`).join('')}
        </div>` : `<div class="mix-badges" style="margin-top:7px;justify-content:flex-start;max-width:100%;">${ESTADOS.filter(e=>distTotal(t,e)>0).map(e=>`<span class="mix-chip state-${e}">${e} ×${distTotal(t,e)}</span>`).join('')}</div>`}
      </div>
      <button class="plan-remove" data-id="${t.id}" title="Quitar del recorrido">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  `).join('');

  container.querySelectorAll('.plan-card').forEach(card=>{
    card.addEventListener('click', (ev)=>{
      if(ev.target.closest('.drag-handle') || ev.target.closest('.plan-remove') || ev.target.closest('.plan-mini-btn')) return;
      openTaskModal(card.dataset.id);
    });
  });
  container.querySelectorAll('.plan-mini-btn').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const t = TASKS.find(x=>x.id===btn.dataset.id);
      setAllTo(t, btn.dataset.estado);
      saveTasks(TASKS);
      renderPlan();
      renderStateChips();
    });
  });
  container.querySelectorAll('.plan-remove').forEach(btn=>{
    btn.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const t = TASKS.find(x=>x.id===btn.dataset.id);
      t.fecha_planificada = null;
      saveTasks(TASKS);
      renderPlan();
    });
  });
  container.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', onDragStart);
  });
}

function onDragStart(ev){
  const handle = ev.currentTarget;
  const card = handle.closest('.plan-card');
  const container = document.getElementById('planList');
  handle.setPointerCapture(ev.pointerId);
  card.classList.add('dragging');
  dragCtx = {pointerId: ev.pointerId, card, container};
  const move = (e)=>{
    if(!dragCtx || e.pointerId !== dragCtx.pointerId) return;
    const y = e.clientY;
    const siblings = [...container.querySelectorAll('.plan-card')].filter(c=>c!==card);
    for(const sib of siblings){
      const rect = sib.getBoundingClientRect();
      const mid = rect.top + rect.height/2;
      if(y < mid && sib.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_FOLLOWING){
        container.insertBefore(card, sib);
        break;
      }
      if(y > mid && sib.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_PRECEDING){
        container.insertBefore(card, sib.nextSibling);
        break;
      }
    }
  };
  const up = (e)=>{
    if(!dragCtx || e.pointerId !== dragCtx.pointerId) return;
    card.classList.remove('dragging');
    handle.releasePointerCapture(e.pointerId);
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    // commit new order
    const ids = [...container.querySelectorAll('.plan-card')].map(c=>c.dataset.id);
    ids.forEach((id, idx)=>{
      const t = TASKS.find(x=>x.id===id);
      if(t) t.orden_plan = idx+1;
    });
    saveTasks(TASKS);
    dragCtx = null;
    renderPlan();
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

    <div class="field-label">Cantidad de equipos</div>
    <input type="number" id="editCantidad" min="1" value="${t.cantidad}">

    <div class="field-label">Abono</div>
    <div class="detail-row"><div class="k">Tipo</div><div class="v">${t.tipo_abono}</div></div>
    <div class="detail-row"><div class="k">Último mantenimiento</div><div class="v">${fmtDate(t.ultimo_mantenimiento)}</div></div>

    ${histHtml ? `<div class="field-label">Historial 2026</div><div class="hist-strip">${histHtml}</div>` : ''}

    <div class="field-label">Mes de vencimiento</div>
    <select id="editMes">
      ${MONTHS.map((m,i)=>`<option value="${i+1}" ${t.mes_vencimiento===i+1?'selected':''}>${m}</option>`).join('')}
    </select>

    <div class="field-label">Planificar visita</div>
    <input type="date" id="editFecha" value="${t.fecha_planificada||''}">

    <div class="field-label">Observaciones para el próximo mantenimiento</div>
    <textarea id="editNota" rows="3" placeholder="Cosas a tener en cuenta la próxima vez…">${escapeHtml(t.nota||'')}</textarea>

    <button class="primary-btn" id="modalSave">Guardar cambios</button>
    <button class="danger-link" id="modalDelete">Eliminar tarea</button>
  `;

  ESTADOS.forEach(e=>{
    const inp = document.getElementById('dist_'+e);
    if(inp) inp.addEventListener('input', ()=>{
      const hint = document.getElementById('distSumHint');
      let sum = 0;
      ESTADOS.forEach(e2=>{ sum += parseInt(document.getElementById('dist_'+e2).value,10) || 0; });
      hint.textContent = `Suma actual: ${sum} de ${t.cantidad}.`;
      hint.classList.toggle('err', sum !== t.cantidad);
    });
  });
  document.getElementById('modalBody').querySelectorAll('.state-big-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      setAllTo(t, btn.dataset.estado);
      saveTasks(TASKS);
      openTaskModal(id);
      renderAll();
    });
  });
  document.getElementById('modalSave').addEventListener('click', ()=>{
    const nuevaCantidad = parseInt(document.getElementById('editCantidad').value,10) || 1;
    if(nuevaCantidad !== t.cantidad){
      t.cantidad = nuevaCantidad;
      setAllTo(t, 'Pendiente');
    } else {
      const vals = {};
      let sum = 0;
      ESTADOS.forEach(e=>{
        const v = parseInt(document.getElementById('dist_'+e).value,10) || 0;
        vals[e] = v; sum += v;
      });
      if(sum === t.cantidad){
        t.distribucion = vals;
      } else {
        alert('El reparto por máquina debe sumar '+t.cantidad+'. No se guardó ese cambio, el resto sí.');
      }
    }
    t.modelo = document.getElementById('editModelo').value.trim();
    t.mes_vencimiento = parseInt(document.getElementById('editMes').value,10);
    const fecha = document.getElementById('editFecha').value;
    if(fecha){
      if(t.fecha_planificada !== fecha){
        const maxOrden = Math.max(0, ...TASKS.filter(x=>x.fecha_planificada===fecha).map(x=>x.orden_plan||0));
        t.orden_plan = maxOrden+1;
      }
      t.fecha_planificada = fecha;
    } else {
      t.fecha_planificada = null;
    }
    t.nota = document.getElementById('editNota').value;
    saveTasks(TASKS);
    closeSheet('taskModal');
    renderAll();
  });
  document.getElementById('modalDelete').addEventListener('click', ()=>{
    if(confirm('¿Eliminar esta tarea definitivamente?')){
      TASKS = TASKS.filter(x=>x.id!==id);
      saveTasks(TASKS);
      closeSheet('taskModal');
      renderAll();
    }
  });

  openSheet('taskModal');
}

  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.getElementById('searchRow').style.display = (view==='plan') ? 'none' : 'flex';
  document.getElementById('stateChipRow').style.display = (view==='plan') ? 'none' : 'flex';
  renderAll();
}

// ================= Overdue banner =================
function renderOverdueBanner(){
  const banner = document.getElementById('overdueBanner');
  const list = overdueUnresolved();
  if(list.length===0){ banner.style.display='none'; return; }
  banner.style.display = 'flex';
  banner.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <p>Tenés ${list.length} mantenimiento${list.length!==1?'s':''} vencido${list.length!==1?'s':''} sin marcar. Decidí qué hacer con cada uno.</p>
    <button id="bannerReview">Ver</button>
  `;
  document.getElementById('bannerReview').addEventListener('click', ()=>{
    state.estadoFilter = 'Vencido';
    switchView('todos');
  });
}

// ================= Render maestro =================
function renderAll(){
  renderStateChips();
  renderOverdueBanner();
  document.getElementById('filterDot').style.display = isFiltersActive() ? 'block' : 'none';
  document.getElementById('pageSub').textContent =
    `${TASKS.filter(t=>!isFullyDone(t)).length} sin resolver de ${TASKS.length} en total`;
  if(state.view==='meses'){ renderMonthStrip(); renderMeses(); }
  else if(state.view==='todos'){ renderTodos(); }
  else if(state.view==='plan'){ renderPlan(); }
}

// ================= Bind general =================
document.querySelectorAll('.tab-btn').forEach(btn=>{ btn.addEventListener('click', ()=> switchView(btn.dataset.view)); });
document.getElementById('searchInput').addEventListener('input', (e)=>{ state.search = e.target.value; renderAll(); });
document.getElementById('btnFilter').addEventListener('click', ()=>{ renderFilterSheet(); openSheet('filterSheet'); });
document.getElementById('filterApply').addEventListener('click', ()=>{ closeSheet('filterSheet'); renderAll(); });
document.getElementById('filterReset').addEventListener('click', ()=>{
  state.sortBy='distancia'; state.tipoFilter='Todos'; state.localidadFilter=[];
  renderFilterSheet();
});
document.getElementById('modalClose').addEventListener('click', ()=>closeSheet('taskModal'));
document.getElementById('addClose').addEventListener('click', ()=>closeSheet('addSheet'));
document.getElementById('distClose').addEventListener('click', ()=>closeSheet('distSheet'));
document.getElementById('planPickerClose').addEventListener('click', ()=>{ closeSheet('planPickerSheet'); renderPlan(); });
document.getElementById('overlay').addEventListener('click', closeAllSheets);
document.getElementById('btnSettings').addEventListener('click', openDistSheet);
document.getElementById('fabAdd').addEventListener('click', ()=>{ if(state.view==='plan') openPlanPicker(); else openAddSheet(); });

document.getElementById('planDate').addEventListener('change', (e)=>{ state.planDate = e.target.value; renderPlan(); });
document.getElementById('planPrevDay').addEventListener('click', ()=> shiftPlanDate(-1));
document.getElementById('planNextDay').addEventListener('click', ()=> shiftPlanDate(1));
function shiftPlanDate(delta){
  const d = new Date(state.planDate+'T00:00:00');
  d.setDate(d.getDate()+delta);
  const p = n=>String(n).padStart(2,'0');
  state.planDate = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  renderPlan();
}

// ================= Init =================
document.getElementById('planDate').value = state.planDate;
renderAll();

// ================= PWA install support =================
(function setupPWA(){
  try{
    const manifest = {
      name: "Mantenimientos", short_name: "Mantenim.", start_url: "./", display: "standalone",
      background_color: "#14181C", theme_color: "#14181C",
      icons: [{src: document.querySelector('link[rel="apple-touch-icon"]').href, sizes: "512x512", type: "image/png"}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    document.getElementById('manifestLink').href = URL.createObjectURL(blob);
  }catch(e){}
  if('serviceWorker' in navigator){
    try{
      const swCode = `self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {});`;
      const swBlob = new Blob([swCode], {type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
    }catch(e){}
  }
})();

</script>
